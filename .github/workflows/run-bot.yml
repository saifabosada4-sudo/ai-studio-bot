name: Run Telegram Bot
on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 */6 * * *' # بيشتغل كل 6 ساعات أوتوماتيك
  workflow_dispatch: # عشان تقدر تشغله بإيدك

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 360 # بيشتغل لمدة 6 ساعات متواصلة
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          
      - name: Install dependencies
        run: pip install -r requirements.txt
        
      - name: Run Bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python bot.py
